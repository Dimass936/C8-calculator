<body>
<div class="wrap">
  <h1>С8 Расчеты</h1>
  <div class="sub">Дивиденды и прогноз прибыли по партнёрской программе</div>
  <nav id="nav"></nav>
  <div id="view"></div>
</div>

<script>
"use strict";

/* =========================================================================
   ДЕСЯТИЧНАЯ АРИФМЕТИКА НА BigInt
   Обычный JS-float даёт 320 * 0.7 = 224.00000000000003, поэтому все деньги
   хранятся как BigInt в масштабе 1e-8 — точно так же, как Decimal в Swift.
   ========================================================================= */
const SCALE = 100000000n;                       // 1e8
const ZERO  = 0n;

function dec(s){                                 // "1 234,5" -> BigInt
  if (s === null || s === undefined) return null;
  let t = String(s).trim().replace(/[\s\u00A0]/g, "").replace(",", ".");
  if (!/^-?(\d+(\.\d*)?|\.\d+)$/.test(t)) return null;
  const neg = t.startsWith("-");
  if (neg) t = t.slice(1);
  const [i, f = ""] = t.split(".");
  const frac = (f + "00000000").slice(0, 8);
  const v = BigInt(i === "" ? "0" : i) * SCALE + BigInt(frac);
  return neg ? -v : v;
}
function fmt(v, opts){                           // BigInt -> "1 234,56"
  const neg = v < ZERO;
  const a = neg ? -v : v;
  const int = a / SCALE;
  let frac = (a % SCALE).toString().padStart(8, "0").replace(/0+$/, "");
  if (opts && opts.fixed2) frac = (a % SCALE).toString().padStart(8, "0").slice(0, 2).replace(/0+$/, "");
  const grp = int.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  return (neg ? "-" : "") + grp + (frac ? "," + frac : "");
}
const add  = (a, b) => a + b;
const sub  = (a, b) => a - b;
const mul  = (a, b) => (a * b) / SCALE;          // масштаб × масштаб
const mulI = (a, n) => a * BigInt(n);            // масштаб × целое

/** Округление a/b до 8 знаков (HALF_UP) — конвертация ₽ -> USDT */
function divRound8(a, b){
  return (2n * a * SCALE + b) / (2n * b);
}
/** Целое «вверх» — как RoundingMode.CEILING в оригинале */
function ceilDiv(a, b){
  if (a >= ZERO) return (a + b - 1n) / b;
  return -((-a) / b);
}
function coerce(v, min, max){ return v < min ? min : (v > max ? max : v); }

/* =========================================================================
   ДАННЫЕ: уровни (эталон — декомпилированный LevelConfiguration)
   ========================================================================= */
const LEVELS = [
  { key:"C1", deposit: 300,   ip:"2.4", base:2, fri:1, sat:1 },
  { key:"C2", deposit: 700,   ip:"5.6", base:2, fri:1, sat:1 },
  { key:"C3", deposit: 1500,  ip:"12",  base:3, fri:1, sat:1 },
  { key:"C4", deposit: 3000,  ip:"24",  base:3, fri:1, sat:1 },
  { key:"C5", deposit: 6000,  ip:"48",  base:4, fri:1, sat:1 },
  { key:"C6", deposit: 10000, ip:"80",  base:4, fri:1, sat:1 }
];
LEVELS.forEach(l => { l.dep = dec(String(l.deposit)); l.inc = dec(l.ip); });

const DIV_RATE = dec("0.02");
const DIV_BASE = { C2:"11.2", C3:"24", C4:"48", C5:"96", C6:"160" };
const WITHHOLD = dec("0.30");
const NET_RATE = dec("0.70");
const MAX_DAYS = 36500;

/* =========================================================================
   ДВИЖОК РАСЧЁТОВ
   ========================================================================= */
function signalCount(i, wd, x, vip, l1){
  const c = LEVELS[i];
  if (wd === 5) return c.fri + (l1 >= 10 ? 1 : 0);   // Пятница
  if (wd === 6) return c.sat + (l1 >= 10 ? 1 : 0);   // Суббота
  return c.base + x + (vip ? 1 : 0);
}
function daily(i, wd, prev, x, vip, l1){
  const sn = signalCount(i, wd, x, vip, l1);
  const income = mulI(LEVELS[i].inc, sn);
  return { signals: sn, incomePerSignal: LEVELS[i].inc, dailyIncome: income, balanceAfter: add(prev, income) };
}
function resolveLevel(cur, balanceAfter, auto){
  if (!auto) return cur;
  let best = -1;
  for (let i = 0; i < LEVELS.length; i++) if (balanceAfter >= LEVELS[i].dep) best = i;
  return best > cur ? best : cur;
}
function dividends(days, counts){
  const out = [];
  let total = ZERO;
  for (const [lvl, baseStr] of Object.entries(DIV_BASE)){
    const n = counts[lvl] || 0;
    const amount = mulI(mulI(mul(dec(baseStr), DIV_RATE), days), n);
    out.push({ level: lvl, participants: n, base: dec(baseStr), amount });
    total = add(total, amount);
  }
  return { levels: out, total };
}
/* =========================================================================
   ТРАСТОВЫЙ ФОНД (доверительное управление)
   Фиксированная сумма на срок, ежедневная прибыль 365 дней в году,
   вывод с комиссией 30%, тело возвращается в конце срока.
   ВАЖНО: уровни VIP Траст НЕ имеют отношения к VIP Групп (та даёт +1 сигнал).
   ========================================================================= */
const TRUST_WITHHOLD = dec("0.30");
const TRUST_LEVELS = [
  { key:"VIP1", sum:"1000",  perDay:"35.7" },
  { key:"VIP2", sum:"3000",  perDay:"120"  },
  { key:"VIP3", sum:"5000",  perDay:"217"  },
  { key:"VIP4", sum:"10000", perDay:"500"  }
];
TRUST_LEVELS.forEach(l => { l.sumD = dec(l.sum); l.perDayD = dec(l.perDay); });

/** Расчёт фонда за календарный период; дни считаются включительно */
function trustFund(levelIdx, start, end){
  const lvl = TRUST_LEVELS[levelIdx];
  if (!lvl) throw new Error("Неизвестный уровень трастового фонда");
  const days = diffDays(start, end) + 1;
  if (days < 1) throw new Error("Дата окончания не может быть раньше даты начала");
  const gross = mulI(lvl.perDayD, days);
  const withholding = mul(gross, TRUST_WITHHOLD);
  return { level: lvl.key, sum: lvl.sumD, perDay: lvl.perDayD, days,
           gross, withholding, net: mul(gross, NET_RATE) };
}

/** Симуляция на N дней */
function simulate(start, nDays, lvl, balance, auto, x, vip, l1){
  if (nDays < 0) throw new Error("Number of days must be non-negative");
  if (balance < ZERO) throw new Error("Starting balance must be non-negative");
  const days = [];
  let level = lvl, bal = balance;
  for (let i = 0; i < nDays; i++){
    const d = addDays(start, i);
    const r = daily(level, d.getDay(), bal, x, vip, l1);
    const next = resolveLevel(level, r.balanceAfter, auto);
    days.push({ date: d, level, deposit: LEVELS[level].dep, signals: r.signals,
                inc: r.incomePerSignal, income: r.dailyIncome, balance: r.balanceAfter, after: next });
    bal = r.balanceAfter; level = next;
  }
  const dep = LEVELS[level].dep;
  const gross = sub(bal, dep);
  return { days, finalBalance: bal, finalLevel: level, deposit: dep, gross,
           withholding: mul(gross, WITHHOLD), net: mul(gross, NET_RATE) };
}
/** Расчёт до целевого баланса */
function targetBalance(start, lvl, balance, target, auto, x, vip, l1){
  if (balance < ZERO)  throw new Error("Starting balance must be non-negative");
  if (target  < ZERO)  throw new Error("Target balance must be non-negative");
  if (x < 0 || l1 < 0) throw new Error("X must be non-negative");

  const days = [];
  let level = lvl, bal = balance, date = start;
  while (bal < target){
    if (days.length >= MAX_DAYS) throw new Error("Target balance was not reached within 36500 days");
    const r = daily(level, date.getDay(), bal, x, vip, l1);
    const next = resolveLevel(level, r.balanceAfter, auto);
    days.push({ date, level, deposit: LEVELS[level].dep, signals: r.signals,
                inc: r.incomePerSignal, income: r.dailyIncome, balance: r.balanceAfter, after: next });
    bal = r.balanceAfter;
    if (bal < target) date = addDays(date, 1);
    level = next;
  }
  // последний день частичный: сколько сигналов реально нужно
  let lastSignals = 0;
  if (days.length){
    const last = days[days.length - 1];
    const before = sub(last.balance, last.income);
    const need = ceilDiv(sub(target, before), last.inc);
    lastSignals = Number(coerce(need, 1n, BigInt(last.signals)));
  }
  let finalBalance = bal;
  if (days.length){
    const last = days[days.length - 1];
    finalBalance = add(sub(last.balance, last.income), mulI(last.inc, lastSignals));
  }
  const dep = LEVELS[level].dep;
  const gross = sub(finalBalance, dep);

  let totalSignals = lastSignals, totalIncome = ZERO;
  if (days.length){
    for (let i = 0; i < days.length - 1; i++){ totalSignals += days[i].signals; totalIncome = add(totalIncome, days[i].income); }
    totalIncome = add(totalIncome, mulI(days[days.length - 1].inc, lastSignals));
  }
  return { date: days.length ? days[days.length - 1].date : start, daysCount: days.length,
           lastSignals, totalSignals, totalIncome, finalBalance, finalLevel: level, deposit: dep,
           gross, withholding: mul(gross, WITHHOLD), net: mul(gross, NET_RATE), days };
}
/** Расчёт до целевой чистой прибыли */
function targetProfit(start, lvl, balance, target, auto, x, vip, l1){
  if (balance < ZERO)  throw new Error("Starting balance must be non-negative");
  if (target  < ZERO)  throw new Error("Target net profit must be non-negative");
  if (x < 0 || l1 < 0) throw new Error("X must be non-negative");

  const np = (bal, lv) => mul(sub(bal, LEVELS[lv].dep), NET_RATE);

  const days = [];
  let level = lvl, bal = balance, date = start;

  if (np(bal, level) >= target){                 // цель уже достигнута
    const dep = LEVELS[level].dep, g = sub(bal, dep);
    return { date, daysCount: 0, lastSignals: 0, totalSignals: 0, totalIncome: ZERO,
             finalBalance: bal, finalLevel: level, deposit: dep, gross: g,
             withholding: mul(g, WITHHOLD), net: mul(g, NET_RATE), days: [] };
  }

  while (days.length < MAX_DAYS){
    const r = daily(level, date.getDay(), bal, x, vip, l1);
    const next = resolveLevel(level, r.balanceAfter, auto);

    if (r.signals >= 1){
      for (let i = 1; i <= r.signals; i++){
        const nb = add(bal, r.incomePerSignal);
        const lv = (i === r.signals) ? next : level;
        if (np(nb, lv) < target){
          if (i === r.signals) break;
          bal = nb; continue;
        }
        const dep = LEVELS[lv].dep, g = sub(nb, dep);
        const dayEntry = { date, level, deposit: LEVELS[level].dep, signals: i,
                           inc: r.incomePerSignal, income: mulI(r.incomePerSignal, i),
                           balance: nb, after: lv };
        const prevSignals = days.reduce((s, d) => s + d.signals, 0);
        const prevIncome  = days.reduce((s, d) => add(s, d.income), ZERO);
        return { date, daysCount: days.length + 1, lastSignals: i,
                 totalSignals: prevSignals + i,
                 totalIncome: add(prevIncome, mulI(r.incomePerSignal, i)),
                 finalBalance: nb, finalLevel: lv, deposit: dep, gross: g,
                 withholding: mul(g, WITHHOLD), net: mul(g, NET_RATE),
                 days: days.concat([dayEntry]) };
      }
    }
    days.push({ date, level, deposit: LEVELS[level].dep, signals: r.signals,
                inc: r.incomePerSignal, income: r.dailyIncome, balance: r.balanceAfter, after: next });
    bal = r.balanceAfter; date = addDays(date, 1); level = next;
  }
  throw new Error("Target net profit was not reached within 36500 days");
}

/* =========================================================================
   ДАТЫ
   ========================================================================= */
function addDays(d, n){ return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n, 12); }
function today(){ const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate(), 12); }
/** Прибавить месяцы с прижимом к последнему дню месяца (31.10 + 6 мес) */
function addMonths(d, n){
  const y = d.getFullYear(), m = d.getMonth() + n, day = d.getDate();
  const last = new Date(y, m + 1, 0).getDate();
  return new Date(y, m, Math.min(day, last), 12);
}
function iso(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function parseDate(s){ const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d, 12); }
function diffDays(a, b){
  const A = Date.UTC(a.getFullYear(), a.getMonth(), a.getDate());
  const B = Date.UTC(b.getFullYear(), b.getMonth(), b.getDate());
  return Math.round((B - A) / 86400000);
}
function fmtDate(d){
  return d.toLocaleDateString("ru-RU", { day:"2-digit", month:"2-digit", year:"numeric" });
}

/** Период фонда ВСЕГДА выводится из периода расчёта.
    Отдельных полей нет намеренно: иначе легко получить молчаливые 6 месяцев
    вместо выбранного периода (на этом уже спотыкались). */
function trustPeriod(){
  const from = parseDate(S.start);
  const to = (S.mode === "date") ? parseDate(S.end) : addMonths(from, 6);
  return { from, to, days: diffDays(from, to) + 1 };
}

function calcProfit(){
  R = { forTab:"profit" };
  const rate = dec(S.rate);
  if (rate === null || rate === undefined){ R.error = "Проверьте числовые поля"; return renderView(); }
  if (rate <= ZERO){ R.error = "Курс USDT должен быть больше 0"; return renderView(); }

  const balance = dec(S.balance);
  if (balance === null){ R.error = "Проверьте числовые поля"; return renderView(); }
  if (balance < ZERO){ R.error = "Текущий баланс не может быть отрицательным"; return renderView(); }

  const x = Math.max(0, parseInt(String(S.x).replace(/\D/g,""), 10) || 0);
  const l1 = S.l1 ? 10 : 0;
  const lvl = LEVELS.findIndex(l => l.key === S.level);
  const start = parseDate(S.start);
  R.rate = rate;

  try {
    // Трастовый фонд — отдельная механика; считаем внутри try, чтобы ошибка
    // в датах показывалась пользователю, а не роняла страницу
    if (S.trust){
      const p = trustPeriod();
      R.trust = trustFund(Number(S.trustLevel) || 0, p.from, p.to);
    }

    if (S.mode === "date"){
      const days = diffDays(start, parseDate(S.end)) + 1;
      if (days < 1){ R.error = "Дата окончания не может быть раньше даты начала"; return renderView(); }
      const r = simulate(start, days, lvl, balance, S.auto, x, S.vip, l1);
      R.profit = Object.assign({ kind:"sim" }, r);
    } else if (S.mode === "balance"){
      const target = dec(S.targetBalance);
      if (target === null){ R.error = "Проверьте числовые поля"; return renderView(); }
      if (target < ZERO){ R.error = "Целевой баланс не может быть отрицательным"; return renderView(); }
      const r = targetBalance(start, lvl, balance, target, S.auto, x, S.vip, l1);
      R.profit = Object.assign({ kind:"target" }, r);
    } else {
      let target = dec(S.targetProfit);
      if (target === null){ R.error = "Проверьте числовые поля"; return renderView(); }
      if (target < ZERO){ R.error = "Целевая чистая прибыль не может быть отрицательной"; return renderView(); }
      if (S.currency === "RUB") target = divRound8(target, rate);   // ₽ -> USDT
      const r = targetProfit(start, lvl, balance, target, S.auto, x, S.vip, l1);
      R.profit = Object.assign({ kind:"target" }, r);
    }
    // finalLevel приходит индексом — приводим к объекту уровня
    R.profit.finalLevel = LEVELS[R.profit.finalLevel];
  } catch(e){ R.error = e.message; }
  renderView();
}

/* --------------------------- Настройки --------------------------- */
function viewSettings(){
  const rows = LEVELS.map(l => `<tr><td>${l.key}</td><td>${l.deposit}</td>
      <td>${l.ip}</td><td>${l.base}</td><td>${l.fri}</td><td>${l.sat}</td></tr>`).join("");
  const t = runSelfTests();
  return `<h2>Справочник уровней</h2>
    <div class="card"><table>
      <tr><th>Уровень</th><th>Депозит</th><th>Доход/сигнал</th><th>Base</th><th>Пт</th><th>Сб</th></tr>
      ${rows}
    </table></div>
    <h2>Данные</h2>
    <div class="card">
      ${row("Состав команды", LEVELS.map(l => `${l.key}: ${S.team[l.key]}`).join(" · "))}
    </div>
    <button class="go secondary" onclick="resetTeam()">Сбросить состав команды</button>
    <h2>Проверка расчётов</h2>
    <div class="card">
      ${row("Утверждений пройдено", t.passed + " из " + t.total, t.failed ? "fail" : "pass")}
      ${t.failed ? t.failures.map(f => row("✗ " + f, "", "fail")).join("") : row("Статус", "Все расчёты совпадают с эталоном", "green")}
    </div>
    <div class="hint">55 утверждений по математике + прогон отрисовки всех экранов и режимов.
      Те же формулы, что в iOS-порте и декомпилированном оригинале.
      Запуск из терминала: <code>node tools/C8Calculations-web/selftest.mjs</code></div>`;
}
function resetTeam(){
  if (!confirm("Сбросить состав команды?")) return;
  S.team = { C1:0, C2:0, C3:0, C4:0, C5:0, C6:0 };
  save(); renderView();
}

/* =========================================================================
   САМОПРОВЕРКА — те же утверждения, что в tools/c8-ios-verify/main.swift
   ========================================================================= */
function runSelfTests(){
  const res = { passed:0, failed:0, failures:[] };
  const ok = (cond, label) => { if (cond) res.passed++; else { res.failed++; res.failures.push(label); } };
  const D = dec;

  // A. Точность
  ok(D("2.4") === 240000000n, "dec(2.4)");
  ok(D("0.02") !== null && mul(D("11.2"), D("0.02")) === D("0.224"), "11.2 × 0.02 = 0.224 точно");
  ok(320n * 1n * 0n === 0n && mul(D("320"), D("0.7")) === D("224"), "320 × 0.7 = 224 (без float-мусора)");

  // B. Уровни
  ok(LEVELS.map(l => l.deposit).join() === "300,700,1500,3000,6000,10000", "депозиты C1–C6");
  ok(LEVELS[0].inc === D("2.4") && LEVELS[5].inc === D("80"), "доход/сигнал C1 и C6");

  // C. Сигналы
  ok(signalCount(0,1,0,false,0) === 2, "Пн C1 → 2");
  ok(signalCount(0,1,3,true,0) === 6, "Пн C1 x=3 VIP → 6");
  ok(signalCount(0,5,0,false,0) === 1, "Пт C1 → 1");
  ok(signalCount(0,5,0,false,10) === 2, "Пт C1 L1≥10 → 2");
  ok(signalCount(0,6,0,false,10) === 2, "Сб C1 L1≥10 → 2");
  ok(signalCount(2,3,0,false,0) === 3, "Ср C3 → 3");
  ok(signalCount(0,5,5,true,0) === 1, "Пт не зависит от X/VIP");

  // D. Дневной расчёт
  const d1 = daily(0, 1, D("300"), 0, false, 0);
  ok(d1.signals === 2 && d1.dailyIncome === D("4.8") && d1.balanceAfter === D("304.8"), "Пн C1 300 → 304.8");

  // E. Апгрейд
  ok(resolveLevel(0, D("304.8"), true) === 0, "304.8 → C1");
  ok(resolveLevel(0, D("700"), true) === 1, "700 → C2");
  ok(resolveLevel(0, D("699.99"), true) === 0, "699.99 → C1");
  ok(resolveLevel(0, D("10000"), true) === 5, "10000 → C6");
  ok(resolveLevel(1, D("700"), false) === 1, "автопереход выкл");
  ok(resolveLevel(2, D("4000"), true) === 3, "4000 → C4");

  // F. Дивиденды
  const dv = dividends(30, { C1:5, C2:1, C3:2 });
  ok(dv.levels.length === 5, "C1 не участвует");
  ok(dv.levels.find(l => l.level === "C2").amount === D("6.72"), "C2 = 6.72");
  ok(dv.levels.find(l => l.level === "C3").amount === D("28.8"), "C3 = 28.8");
  ok(dv.total === D("35.52"), "итого 35.52");

  // G. Даты и симуляция
  const mon = new Date(2026, 0, 5, 12);
  ok(mon.getDay() === 1, "2026-01-05 — понедельник");
  ok(new Date(2026, 0, 9, 12).getDay() === 5, "2026-01-09 — пятница");
  ok(new Date(2026, 0, 10, 12).getDay() === 6, "2026-01-10 — суббота");
  ok(new Date(2026, 0, 11, 12).getDay() === 0, "2026-01-11 — воскресенье");

  const sim = simulate(mon, 7, 0, ZERO, false, 0, false, 0);
  ok(sim.days.length === 7, "7 дней");
  ok(sim.finalBalance === D("28.8"), "баланс 28.8");
  ok(sim.deposit === D("300"), "депозит 300");
  ok(sim.gross === D("-271.2"), "прибыль -271.2");
  ok(sim.withholding === D("-81.36"), "комиссия -81.36");
  ok(sim.net === D("-189.84"), "чистая -189.84");

  // H. Целевой баланс
  const tb = targetBalance(mon, 0, ZERO, D("9.6"), false, 0, false, 0);
  ok(tb.daysCount === 2, "2 полных дня");
  ok(tb.lastSignals === 2, "последний день 2 сигнала");
  ok(tb.totalSignals === 4, "всего 4 сигнала");
  ok(tb.totalIncome === D("9.6"), "доход 9.6");
  ok(tb.finalBalance === D("9.6"), "баланс 9.6");
  ok(iso(tb.date) === "2026-01-06", "дата достижения 2026-01-06");

  const tb2 = targetBalance(mon, 0, D("500"), D("100"), false, 0, false, 0);
  ok(tb2.daysCount === 0 && tb2.lastSignals === 0, "цель уже достигнута");
  ok(tb2.gross === D("200") && tb2.withholding === D("60") && tb2.net === D("140"), "200/60/140");

  // I. Целевая чистая прибыль
  const tp = targetProfit(mon, 5, D("10000"), D("224"), false, 0, false, 0);
  ok(tp.daysCount === 1, "1 день");
  ok(tp.lastSignals === 4, "4 сигнала");
  ok(tp.totalIncome === D("320"), "доход 320");
  ok(tp.finalBalance === D("10320"), "баланс 10320");
  ok(tp.gross === D("320") && tp.withholding === D("96") && tp.net === D("224"), "320/96/224");

  // J. Ошибки вместо падения
  const throws = (fn) => { try { fn(); return false; } catch(e){ return true; } };
  ok(throws(() => targetProfit(mon, 0, D("300"), D("-1"), false, 0, false, 0)), "отрицательная цель → ошибка");
  ok(throws(() => targetBalance(mon, 0, D("300"), D("-5"), false, 0, false, 0)), "отрицательный баланс → ошибка");
  ok(throws(() => simulate(mon, 5, 0, D("-1"), false, 0, false, 0)), "стартовый баланс -1 → ошибка");
  ok(throws(() => targetBalance(mon, 0, ZERO, D("1000000"), false, 0, false, 0)), "недостижимая цель → ошибка");

  // K. Конвертация ₽ → USDT
  ok(divRound8(D("8000"), D("80")) === D("100"), "8000 ₽ / 80 = 100 USDT");
  ok(divRound8(D("10"), D("3")) === D("3.33333333"), "10 ₽ / 3 = 3,33333333");
  ok(divRound8(D("80"), D("75")) === D("1.06666667"), "80 ₽ / 75 = 1,06666667");

  // L. Формат чисел
  ok(fmt(D("1234567.5")) === "1 234 567,5", "формат 1 234 567,5");
  ok(fmt(D("-271.2")) === "-271,2", "формат -271,2");

  // M. Трастовый фонд
  const tStart = new Date(2026, 0, 5, 12);    // 5 января
  const t30    = new Date(2026, 1, 3, 12);    // 3 февраля → 30 дней
  const t12    = new Date(2026, 0, 16, 12);   // 16 января → 12 дней

  ok(TRUST_LEVELS.length === 4 && TRUST_LEVELS[0].key === "VIP1", "фонд: 4 уровня VIP Траст");

  const f1 = trustFund(0, tStart, t30);
  ok(f1.days === 30, "фонд: 30 дней (включительно)", String(f1.days));
  ok(f1.sum === D("1000"), "фонд VIP1: тело 1000");
  ok(f1.perDay === D("35.7"), "фонд VIP1: 35,7 в день");
  ok(f1.gross === D("1071"), "фонд VIP1: 35,7 × 30 = 1071", fmt(f1.gross));
  ok(f1.withholding === D("321.3"), "фонд VIP1: комиссия 321,3", fmt(f1.withholding));
  ok(f1.net === D("749.7"), "фонд VIP1: чистыми 749,7", fmt(f1.net));

  const f3 = trustFund(2, tStart, t30);
  ok(f3.gross === D("6510") && f3.net === D("4557"),
     "фонд VIP3: 217 × 30 = 6510 / 4557", fmt(f3.gross) + "/" + fmt(f3.net));

  const f4 = trustFund(3, tStart, t30);
  ok(f4.gross === D("15000") && f4.net === D("10500"),
     "фонд VIP4: 500 × 30 = 15000 / 10500", fmt(f4.gross) + "/" + fmt(f4.net));

  const f2 = trustFund(1, tStart, t12);
  ok(f2.days === 12 && f2.gross === D("1440") && f2.net === D("1008"),
     "фонд VIP2: 12 дней → 120 × 12 = 1440 / 1008",
     f2.days + "дн " + fmt(f2.gross) + "/" + fmt(f2.net));

  ok(throws(() => trustFund(0, t30, tStart)), "фонд: конец < начало → ошибка");

  return { total: res.passed + res.failed, ...res };
}

go(S.tab);
